<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4fb"><title>Korean Bloom 🌸 Học tiếng Hàn</title><style>
:root{font-family:Inter,system-ui,'Segoe UI',sans-serif;color:#322c48;background:#faf8ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b38be7;outline-offset:2px}.app{max-width:1450px;margin:auto;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,#fff3fa,#f8f2ff);border-right:1px solid #f1e6f5;padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;font-size:24px;color:#c73b93;margin-bottom:5px}.sub{font-size:12px;color:#8b7898}.nav{margin-top:34px;display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:13px;color:#605675}.nav button.active,.nav button:hover{background:#fce1f1;color:#bc237c;font-weight:800}.tip{margin-top:38px;background:#eae0ff;border-radius:22px;padding:18px;line-height:1.7}.main{padding:25px 30px 70px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top .right{display:flex;gap:10px;align-items:center}.pill{display:inline-flex;align-items:center;gap:5px;background:#f7e9ff;color:#8e4e9c;border-radius:100px;padding:7px 12px;font-size:12px;font-weight:750}.hero{background:linear-gradient(110deg,#f8e2fa,#ffeaf0 58%,#dff9ee);padding:28px;border-radius:27px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px;overflow:hidden}.hero h1{font-size:clamp(25px,3.5vw,39px);margin:8px 0}.hero p{color:#746780;max-width:650px;line-height:1.7}.hero-art{font-size:80px;white-space:nowrap}.panel{background:white;border:1px solid #f0e9f4;border-radius:22px;padding:22px;box-shadow:0 9px 26px #57436809;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{background:white;border:1px solid #eee6f3;border-radius:18px;padding:18px}.stat b{font-size:27px;display:block;margin:7px 0}.muted{color:#81778d}.small{font-size:13px}.primary{background:#f33495;color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:800}.outline{background:#fff;color:#79509b;border:1px solid #e0cce9;border-radius:12px;padding:11px 15px;font-weight:650}.ghost{background:#faf7ff;color:#6f568b;border:1px solid #eee4f4;border-radius:12px;padding:10px 13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.filters button.active,.tabs button.active{background:#fce4f2;color:#c32783;border-color:#f6add1}.lesson{display:flex;gap:14px;align-items:center;min-height:120px}.emoji{font-size:44px;background:#f8ecff;padding:15px;border-radius:17px;min-width:79px;text-align:center}.lesson h3{margin:0 0 5px}.lesson p{margin:0 0 8px}.lesson button{margin-top:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid #eee2f4;border-radius:12px;padding:12px 14px;background:white;color:#6b6079}.vocab{border:1px solid #efe6f2;border-radius:18px;padding:18px;text-align:center;background:#fffcff}.vocab .art{font-size:59px;background:linear-gradient(140deg,#fff0f6,#f0eaff);border-radius:15px;padding:14px}.vocab h3{font-size:24px;margin:14px 0 4px}.grammar,.bubble{background:#faf5ff;border-radius:16px;padding:17px;margin:12px 0;line-height:1.75}.bubble:nth-child(2n){background:#fff0f6}.quizopt{display:block;width:100%;text-align:left;background:white;border:1px solid #e7dcea;border-radius:13px;padding:14px;margin:8px 0}.quizopt.selected{background:#fae4f3;border:2px solid #ed65af}.quizopt.correct{background:#e6f9ed;border-color:#58b982}.quizopt.wrong{background:#ffe8eb;border-color:#e38c9c}.bar{height:10px;border-radius:100px;background:#f1e8f4;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#f75fa8,#9b79df)}.notice{padding:14px 17px;background:#fff6e8;border-radius:14px;color:#805f37;margin:14px 0;line-height:1.7}.success{background:#e8f9ef;color:#24744a}.danger{background:#ffebf0;color:#9a3b5e}.settings label{display:block;margin:13px 0 5px}.settings select,.settings input{border:1px solid #e5d7ef;border-radius:10px;padding:11px;max-width:100%;background:white}.flash{border:2px solid #e8d5f5;border-radius:24px;min-height:250px;display:grid;place-content:center;text-align:center;cursor:pointer;background:linear-gradient(135deg,#fff0f7,#f1edff);padding:22px}.flash .big{font-size:42px;font-weight:900}.footer{font-size:12px;color:#94859b;text-align:center;margin-top:32px}.mobilemenu{display:none}.hide{display:none!important}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:195px 1fr}.main{padding:20px}.side{padding:22px 10px}}@media(max-width:740px){.app{display:block}.side{position:static;height:auto;padding:13px 16px}.side .nav{display:flex;overflow:auto;margin-top:12px;gap:5px}.side .nav button{white-space:nowrap;padding:10px}.side .tip{display:none}.main{padding:15px}.hero{padding:20px}.hero-art{font-size:46px}.grid,.grid.two{grid-template-columns:1fr}.panel{padding:16px}.top{align-items:flex-start}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🌸 Korean Bloom</div><div class="sub">Học tiếng Hàn thật vui!</div><nav class="nav" id="nav"></nav><div class="tip">🌷 Mỗi ngày một chút, tiếng Hàn sẽ nở hoa!<p class="small muted">Dữ liệu học lưu trên thiết bị này.</p></div></aside><main class="main"><header class="top"><span class="muted small">Fun! Fun! Korean · 2 quyển · 30 chủ đề</span><div class="right"><span class="pill" id="streak">🔥 Học đều mỗi ngày</span><span class="pill">👩🏻‍🎓 Học viên</span></div></header><div id="view"></div><div class="footer">Korean Bloom 🌸 · Nội dung luyện tập tự biên soạn theo chủ đề · Bản tĩnh không sử dụng OpenAI API</div></main></div><script src="data/lessons.js"></script><script>
'use strict';
const LESSONS=window.KB_LESSONS||[];const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const storeKey='korean-bloom-v2';const blank=()=>({done:[],attempts:[],reviews:{},daily:{},settings:{quizCount:10},savedQuiz:null});let state;try{state={...blank(),...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch{state=blank()};const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){alert('Không lưu được dữ liệu: '+e.message)}};let page='dashboard',book=1,selectedLesson='1-1',lessonTab='vocab',quiz=null,flashIndex=0,flashBack=false,reviewOnly=false;
function speak(s){if(!('speechSynthesis'in window))return alert('Trình duyệt không hỗ trợ đọc văn bản');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.82;speechSynthesis.speak(u)}function setPage(p){page=p;quiz=null;render()}function lesson(id){return LESSONS.find(x=>x.id===id)||LESSONS[0]}function openLesson(id,t='vocab'){selectedLesson=id;lessonTab=t;quiz=null;page='lesson';render()}function today(){return new Date().toLocaleDateString('en-CA')}function recordStudy(){state.daily[today()]=(state.daily[today()]||0)+1;save()}function markDone(id){if(!state.done.includes(id))state.done.push(id);recordStudy();save();render()}function nav(){const items=[['dashboard','🏠 Trang chủ'],['courses','📚 Bài học'],['practice','✨ Luyện tập'],['flashcards','🗂️ Flashcard'],['progress','📈 Tiến độ'],['settings','⚙️ Cài đặt']];$('#nav').innerHTML=items.map(([p,n])=>`<button class="${page===p||page==='lesson'&&p==='courses'?'active':''}" onclick="setPage('${p}')">${n}</button>`).join('')}
function hero(title,desc,art='🌸',tag='Korean Bloom'){return `<section class="hero"><div><span class="pill">${esc(tag)}</span><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="hero-art">${art}</div></section>`}
function dashboard(){const total=state.attempts.length;const mean=total?Math.round(state.attempts.reduce((s,a)=>s+a.score/a.total*100,0)/total):0;const last=LESSONS.filter(l=>!state.done.includes(l.id))[0]||LESSONS[0];return hero('안녕하세요! Hôm nay học gì?','Khám phá 30 chủ đề tiếng Hàn, luyện phát âm và làm bài tập theo tốc độ của riêng bạn.','👩🏻‍💻🌷','Hành trình học tiếng Hàn')+`<div class="grid"><div class="stat">📚 Bài hoàn thành<b>${state.done.length}/30</b><div class="bar"><div style="width:${state.done.length/30*100}%"></div></div></div><div class="stat">🧩 Lượt luyện tập<b>${total}</b><span class="muted small">Đã lưu trên trình duyệt</span></div><div class="stat">🎯 Điểm trung bình<b>${mean}%</b><span class="muted small">Theo lịch sử bài kiểm tra</span></div></div><div class="panel"><h2>🌼 Tiếp tục học</h2><div class="lesson"><div class="emoji">${last.emoji}</div><div><h3>Quyển ${last.book} · Bài ${String(last.number).padStart(2,'0')} — ${esc(last.ko)}</h3><p class="muted">${esc(last.vi)}</p><button class="primary" onclick="openLesson('${last.id}')">Vào bài học →</button></div></div></div><div class="panel"><h2>💜 Lộ trình học</h2><div class="grid two"><div class="stat"><h3>📕 Fun! Fun! Korean 1</h3><p>15 bài · Nền tảng sơ cấp</p><button class="outline" onclick="book=1;setPage('courses')">Xem quyển 1</button></div><div class="stat"><h3>📗 Fun! Fun! Korean 2</h3><p>15 bài · Sơ cấp mở rộng</p><button class="outline" onclick="book=2;setPage('courses')">Xem quyển 2</button></div></div></div>`}
function courses(){return hero('Thư viện bài học','Chọn quyển và chủ đề để học từ vựng, ngữ pháp, hội thoại và bài tập.','📚✨','30 bài học')+`<div class="filters"><button class="outline ${book===1?'active':''}" onclick="book=1;render()">📕 Quyển 1 · 15 bài</button><button class="outline ${book===2?'active':''}" onclick="book=2;render()">📗 Quyển 2 · 15 bài</button></div><div class="grid">${LESSONS.filter(l=>l.book===book).map(l=>`<div class="stat lesson"><div class="emoji">${l.emoji}</div><div><span class="pill">Bài ${String(l.number).padStart(2,'0')} ${state.done.includes(l.id)?'· ✓ Đã học':''}</span><h3>${esc(l.ko)}</h3><p class="small muted">${esc(l.vi)}</p><button class="outline" onclick="openLesson('${l.id}')">Mở bài →</button></div></div>`).join('')}</div>`}
function lessonPage(){const l=lesson(selectedLesson);let content='';if(lessonTab==='vocab')content=`<p class="muted">Bấm 🔊 để nghe tiếng Hàn. Hình emoji chỉ mang tính minh họa.</p><div class="grid">${l.vocab.map(w=>`<div class="vocab"><div class="art">${w.emoji}</div><h3>${esc(w.ko)}</h3><p>${esc(w.vi)}</p><button class="outline" onclick='speak(${JSON.stringify(w.ko)})'>🔊 Nghe</button><button class="ghost" onclick='addReview(${JSON.stringify(l.id+':'+w.ko)})'>☆ Ôn lại</button></div>`).join('')}</div>`;if(lessonTab==='grammar')content=l.grammar.map((g,i)=>`<div class="grammar"><span class="pill">Ngữ pháp ${i+1}</span><h2>${esc(g.pattern)}</h2><p>${esc(g.meaning)}</p><b>${esc(g.example)}</b> <button class="ghost" onclick='speak(${JSON.stringify(g.example)})'>🔊</button><p class="muted">${esc(g.translation)}</p></div>`).join('');if(lessonTab==='dialogue')content=`${l.illustrativeDialogue?'<div class="notice">Hội thoại minh họa tự tạo để luyện từ vựng; chưa phải hội thoại chính thức của giáo trình.</div>':''}<button class="outline" onclick='speak(${JSON.stringify(l.dialogue.map(d=>d.ko).join(' '))})'>🔊 Nghe cả đoạn</button>${l.dialogue.map(d=>`<div class="bubble"><b>💬 ${esc(d.speaker)}</b><h3>${esc(d.ko)}</h3><p class="muted">${esc(d.vi)}</p><button class="ghost" onclick='speak(${JSON.stringify(d.ko)})'>🔊 Nghe câu</button></div>`).join('')}`;if(lessonTab==='quiz')content=quizUI(l);return hero(`${l.ko} · ${l.vi}`,`Quyển ${l.book} · Bài ${String(l.number).padStart(2,'0')} · ${l.vocab.length} từ vựng · ${l.grammar.length} mẫu ngữ pháp`,l.emoji,'Bài học tương tác')+`<div class="row"><button class="ghost" onclick="setPage('courses')">← Tất cả bài</button><button class="outline" onclick="markDone('${l.id}')">${state.done.includes(l.id)?'✓ Đã hoàn thành':'✓ Đánh dấu đã học'}</button></div><div class="panel"><div class="tabs">${[['vocab','🖼️ Từ vựng'],['grammar','📖 Ngữ pháp'],['dialogue','💬 Hội thoại'],['quiz','🧩 Bài tập']].map(([k,v])=>`<button class="${lessonTab===k?'active':''}" onclick="lessonTab='${k}';quiz=null;render()">${v}</button>`).join('')}</div>${content}</div>`}
function addReview(key){state.reviews[key]={due:Date.now(),interval:0,ease:2.5};save();alert('Đã thêm từ vào danh sách ôn tập!')}
function makeQuestions(l,count=10){let base=[];l.vocab.forEach((w,i)=>{const others=l.vocab.filter(x=>x.ko!==w.ko);if(others.length>=3){let opts=[w,...others.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);base.push({type:'Từ vựng',prompt:`“${w.vi}” trong tiếng Hàn là gì?`,options:opts.map(x=>x.ko),correct:opts.findIndex(x=>x.ko===w.ko),why:`${w.ko} = ${w.vi}.`,audio:w.ko});let opts2=[w,...others.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);base.push({type:'Nghe hiểu',prompt:'Nghe phát âm rồi chọn nghĩa đúng.',options:opts2.map(x=>x.vi),correct:opts2.findIndex(x=>x.ko===w.ko),why:`${w.ko} = ${w.vi}.`,audio:w.ko});}});l.grammar.forEach(g=>{base.push({type:'Ngữ pháp',prompt:`Câu “${g.example}” có nghĩa là gì?`,options:[g.translation,'Tôi không biết.','Bạn đang làm gì?','Hẹn gặp lại.'],correct:0,why:`${g.pattern}: ${g.meaning}.`,audio:g.example})});if(!base.length)return[];let result=[];while(result.length<count){let batch=[...base].sort(()=>Math.random()-.5);for(const q of batch){if(result.length>=count)break;let order=q.options.map((_,i)=>i).sort(()=>Math.random()-.5);result.push({...q,options:order.map(i=>q.options[i]),correct:order.indexOf(q.correct)})}}return result}
function startQuiz(id,mode='lesson'){const l=lesson(id);selectedLesson=id;lessonTab='quiz';page=mode==='practice'?'practice':'lesson';quiz={id,questions:makeQuestions(l,Number(state.settings.quizCount)||10),answers:{},index:0,submitted:false};render()}
function chooseAnswer(i){quiz.answers[quiz.index]=i;render()}function nextQ(step){quiz.index=Math.max(0,Math.min(quiz.questions.length-1,quiz.index+step));render()}function submitQuiz(){if(!quiz)return;let score=quiz.questions.filter((q,i)=>quiz.answers[i]===q.correct).length;quiz.submitted=true;quiz.score=score;state.attempts.unshift({id:quiz.id,at:new Date().toISOString(),score,total:quiz.questions.length});state.attempts=state.attempts.slice(0,200);recordStudy();save();render()}
function quizUI(l){if(!quiz||quiz.id!==l.id)return `<div class="notice">🎲 Bộ câu hỏi được tạo bằng cách trộn câu hỏi và đáp án từ dữ liệu trong mã nguồn. <b>Đây không phải AI thật.</b> Chưa có backend/API key.</div><h2>Luyện tập ${esc(l.ko)}</h2><p>${state.settings.quizCount||10} câu · Từ vựng, nghe hiểu và ngữ pháp</p><button class="primary" onclick="startQuiz('${l.id}')">✨ Tạo bộ câu hỏi</button>`;if(quiz.submitted)return `<div style="text-align:center"><div style="font-size:65px">🏆</div><h2>Kết quả ${quiz.score}/${quiz.questions.length}</h2><p>Đã lưu kết quả vào tiến độ.</p></div>${quiz.questions.map((q,i)=>`<div class="grammar"><b>Câu ${i+1}: ${esc(q.prompt)}</b><p class="${quiz.answers[i]===q.correct?'success':'danger'} notice">${quiz.answers[i]===q.correct?'✓ Đúng':'✕ Sai'} · Đáp án: ${esc(q.options[q.correct])}</p><p>${esc(q.why)}</p></div>`).join('')}<button class="primary" onclick="startQuiz('${l.id}')">Làm bộ đề mới</button>`;const q=quiz.questions[quiz.index];return `<div class="row"><span class="pill">${esc(q.type)}</span><b>Câu ${quiz.index+1}/${quiz.questions.length}</b></div><div class="bar" style="margin:16px 0"><div style="width:${(quiz.index+1)/quiz.questions.length*100}%"></div></div><h2>${esc(q.prompt)}</h2>${q.audio?`<button class="outline" onclick='speak(${JSON.stringify(q.audio)})'>🔊 Nghe tiếng Hàn</button>`:''}<div style="margin:18px 0">${q.options.map((o,i)=>`<button class="quizopt ${quiz.answers[quiz.index]===i?'selected':''}" onclick="chooseAnswer(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div class="row"><button class="outline" onclick="nextQ(-1)" ${quiz.index===0?'disabled':''}>← Câu trước</button>${quiz.index===quiz.questions.length-1?'<button class="primary" onclick="submitQuiz()">Nộp bài và chấm điểm</button>':'<button class="primary" onclick="nextQ(1)">Câu tiếp →</button>'}</div><p class="muted small">Đã trả lời ${Object.keys(quiz.answers).length}/${quiz.questions.length} câu.</p>`}
function practice(){return hero('Luyện tập thông minh','Tạo bộ đề mới theo chủ đề từ ngân hàng câu hỏi offline. AI OpenAI sẽ được tích hợp khi có backend.','✨🧠','Chế độ luyện tập')+`<div class="notice">⚠️ <b>Chưa kết nối AI thật.</b> Bộ đề hiện được trộn tự động từ nội dung bài học trong mã nguồn; không gửi dữ liệu ra dịch vụ ngoài.</div><div class="panel"><h2>Chọn chủ đề</h2><div class="row"><select id="practiceLesson" style="padding:12px;border:1px solid #e3d5ec;border-radius:12px;max-width:100%">${LESSONS.map(l=>`<option value="${l.id}" ${selectedLesson===l.id?'selected':''}>Quyển ${l.book} · Bài ${l.number} — ${esc(l.ko)} (${esc(l.vi)})</option>`).join('')}</select><button class="primary" onclick="startQuiz($('#practiceLesson').value,'practice')">✨ Tạo đề</button></div>${quiz?`<hr style="border:0;border-top:1px solid #f0e7f4;margin:24px 0">${quizUI(lesson(quiz.id))}`:''}</div>`}
function dueWords(){const now=Date.now();return LESSONS.flatMap(l=>l.vocab.map(w=>({...w,key:l.id+':'+w.ko,lessonId:l.id}))).filter(w=>state.reviews[w.key]&&(!reviewOnly||state.reviews[w.key].due<=now))}
function flashcards(){const all=LESSONS.flatMap(l=>l.vocab.map(w=>({...w,key:l.id+':'+w.ko,lessonId:l.id})));let words=reviewOnly?dueWords():all;if(!words.length)return hero('Flashcard ôn tập','Chưa có từ nào đến hạn. Bạn có thể xem toàn bộ thẻ.','🎉')+`<button class="primary" onclick="reviewOnly=false;render()">Xem tất cả</button>`;flashIndex%=words.length;let w=words[flashIndex];return hero('Flashcard tiếng Hàn','Lật thẻ để xem nghĩa. Đánh giá độ nhớ để lập lịch ôn tập đơn giản.','🗂️🌼','Ôn tập giãn cách')+`<div class="filters"><button class="outline ${!reviewOnly?'active':''}" onclick="reviewOnly=false;flashIndex=0;render()">Tất cả (${all.length})</button><button class="outline ${reviewOnly?'active':''}" onclick="reviewOnly=true;flashIndex=0;render()">Đến hạn (${dueWords().length})</button></div><div class="panel"><div class="row"><span class="pill">Thẻ ${flashIndex+1}/${words.length}</span><button class="outline" onclick='speak(${JSON.stringify(w.ko)})'>🔊 Phát âm</button></div><div class="flash" onclick="flashBack=!flashBack;render()"><div class="big">${flashBack?esc(w.vi):esc(w.ko)}</div><p class="muted">${flashBack?'Nghĩa tiếng Việt':'Nhấn để lật thẻ'}</p><div style="font-size:38px">${w.emoji}</div></div><div class="row" style="margin-top:16px"><button class="outline" onclick="flashIndex=(flashIndex+words.length-1)%words.length;flashBack=false;render()">← Trước</button><div><button class="ghost" onclick="rateCard('${esc(w.key)}',false)">😅 Chưa nhớ</button> <button class="primary" onclick="rateCard('${esc(w.key)}',true)">😊 Đã nhớ</button></div><button class="outline" onclick="flashIndex=(flashIndex+1)%words.length;flashBack=false;render()">Tiếp →</button></div></div>`}
function rateCard(key,good){const r=state.reviews[key]||{interval:0,ease:2.5};r.interval=good?(r.interval===0?1:Math.max(1,Math.round(r.interval*r.ease))):0;r.due=Date.now()+(good?r.interval*86400000:60000);r.ease=Math.max(1.3,r.ease+(good?.1:-.2));state.reviews[key]=r;recordStudy();save();flashIndex++;flashBack=false;render()}
function progress(){return hero('Tiến độ học tập','Theo dõi các bài đã học và kết quả luyện tập trên thiết bị này.','📈💜','Thống kê')+`<div class="grid"><div class="stat">Đã hoàn thành<b>${state.done.length}/30</b></div><div class="stat">Số lượt kiểm tra<b>${state.attempts.length}</b></div><div class="stat">Flashcard đang theo dõi<b>${Object.keys(state.reviews).length}</b></div></div><div class="panel"><h2>Tiến độ theo quyển</h2>${[1,2].map(b=>{let n=state.done.filter(id=>id.startsWith(b+'-')).length;return `<p>Quyển ${b}: ${n}/15 bài</p><div class="bar"><div style="width:${n/15*100}%"></div></div>`}).join('')}</div><div class="panel"><h2>Lịch sử luyện tập</h2>${state.attempts.length?state.attempts.slice(0,30).map(a=>`<div class="row" style="border-bottom:1px solid #f2edf5;padding:11px 0"><span>${esc(lesson(a.id).ko)} <span class="muted small">· ${new Date(a.at).toLocaleString('vi-VN')}</span></span><b>${a.score}/${a.total}</b></div>`).join(''):'<p class="muted">Chưa có lượt làm bài nào.</p>'}</div>`}
function settings(){return hero('Cài đặt & dữ liệu','Xuất bản sao lưu tiến độ hoặc nhập dữ liệu từ thiết bị khác.','⚙️🌷','Cá nhân hóa')+`<div class="panel settings"><h2>Cấu hình luyện tập</h2><label for="count">Số câu trong mỗi bộ đề</label><select id="count" onchange="state.settings.quizCount=Number(this.value);save()">${[5,10,15,20].map(n=>`<option value="${n}" ${state.settings.quizCount===n?'selected':''}>${n} câu</option>`).join('')}</select><h2>Sao lưu dữ liệu</h2><p class="muted">Dữ liệu lưu ở localStorage của trình duyệt, không đồng bộ giữa máy tính và điện thoại.</p><div class="filters"><button class="outline" onclick="exportData()">⬇️ Xuất dữ liệu JSON</button><label class="outline" for="importFile" style="margin:0;cursor:pointer">⬆️ Nhập dữ liệu JSON</label><input class="hide" id="importFile" type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div><div class="notice">Dữ liệu trên thiết bị này có thể mất nếu bạn xóa dữ liệu trình duyệt. Hãy xuất bản sao lưu định kỳ.</div><button class="ghost" onclick="if(confirm('Xóa toàn bộ tiến độ học trên thiết bị này?')){state=blank();save();render()}">🗑️ Xóa tiến độ trên thiết bị</button></div><div class="panel"><h2>Trạng thái hệ thống</h2><p>🌐 Hosting: GitHub Pages (website tĩnh)</p><p>💾 Database: Chưa sử dụng</p><p>✨ OpenAI API: Chưa kết nối</p><p>🔊 Phát âm: Speech Synthesis của trình duyệt (phụ thuộc giọng có sẵn)</p></div>`}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'Korean Bloom',version:2,data:state},null,2)],{type:'application/json'}));a.download='korean-bloom-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='Korean Bloom'||!x.data||!Array.isArray(x.data.done)||!Array.isArray(x.data.attempts))throw Error('File sao lưu không hợp lệ');if(confirm('Ghi đè dữ liệu học hiện tại?')){state={...blank(),...x.data};save();render()}}catch(e){alert(e.message)}}
function render(){nav();let fn={dashboard,courses,lesson:lessonPage,practice,flashcards,progress,settings}[page]||dashboard;$('#view').innerHTML=fn();$('#streak').textContent=`🔥 ${Object.keys(state.daily).length} ngày có học`};render();
</script></body></html>
